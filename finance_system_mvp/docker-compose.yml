services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://finance:finance@db:5432/finance
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
