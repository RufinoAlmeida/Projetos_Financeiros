[project]
name = "picpay-simplificado"
version = "1.0.0"
description = "Backend challenge inspired by the PicPay Simplificado assessment"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "email-validator>=2.3,<3.0",
  "argon2-cffi>=25.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
  "pyright>=1.1,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
