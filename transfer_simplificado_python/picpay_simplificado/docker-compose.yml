services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: picpay
      POSTGRES_USER: picpay
      POSTGRES_PASSWORD: picpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpay -d picpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://picpay:picpay@postgres:5432/picpay
      AUTHORIZATION_URL: https://util.devi.tools/api/v2/authorize
      NOTIFICATION_URL: https://util.devi.tools/api/v1/notify
      HTTP_TIMEOUT_SECONDS: 5
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
